version: 1
disable_existing_loggers: false  # 这个保留

formatters:
  standard:
    format: '%(asctime)s - %(name)s - %(levelname)s - %(message)s'
    datefmt: '%Y-%m-%d %H:%M:%S'

handlers:
  default:
    formatter: standard
    class: logging.StreamHandler
    stream: ext://sys.stdout

loggers:
  uvicorn:
    handlers: [default]
    level: INFO
    propagate: false  # 必须添加这个来解决重复
  uvicorn.error:
    level: INFO
    propagate: false  # 必须添加这个来解决重复
  uvicorn.access:
    handlers: [default]
    level: INFO
    propagate: false  # 必须添加这个来解决重复

root:
  handlers: [default]
  level: INFO