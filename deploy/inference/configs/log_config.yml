version: 1
disable_existing_loggers: false  # 这个保留

formatters:
  standard:
    format: '%(asctime)s - %(name)s - %(levelname)s - %(message)s'
    datefmt: '%Y-%m-%d %H:%M:%S'
  access:
    class: inference.utils.logging.CustomAccessFormatter
    format: '%(asctime)s - %(client_addr)s - "%(request_line)s" %(status_code)s'
    datefmt: '%Y-%m-%d %H:%M:%S'

handlers:
  default:
    formatter: standard
    class: logging.StreamHandler
    stream: ext://sys.stdout
  
  file:
    formatter: standard
    class: logging.handlers.RotatingFileHandler
    filename: logs/app.log
    maxBytes: 10485760  # 10MB
    backupCount: 5
    encoding: utf8

loggers:
  uvicorn:
    handlers: [default, file]
    level: INFO
    propagate: false  # 必须添加这个来解决重复
  uvicorn.error:
    level: INFO
    propagate: false  # 必须添加这个来解决重复
  uvicorn.access:
    handlers: [default]
    level: INFO
    propagate: false  # 必须添加这个来解决重复

root:
  handlers: [default, file]
  level: INFO